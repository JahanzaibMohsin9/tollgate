[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true # pqc-forge: real ML-DSA-87 via lib/pqc-forge/ffi/mldsa.mjs
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@pqc-forge/=lib/pqc-forge/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[invariant]
runs = 64
depth = 64
fail_on_revert = false
