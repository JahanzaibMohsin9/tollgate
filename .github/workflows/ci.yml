name: CI
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: lib/pqc-forge
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && node --import tsx --input-type=module -e "await import('./src/texts.ts'); await import('./src/escrow.ts'); console.log('agent modules load')"
        working-directory: agent
